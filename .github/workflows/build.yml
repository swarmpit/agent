name: Test, Build & Deploy

on:
  push:
    branches: [ 'master' ]
    tags: [ '*' ]
  pull_request:
    branches: [ 'master' ]
  workflow_dispatch:

jobs:
  go:
    name: Test & Build Go
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      # toolchain comes from the image the Dockerfile builds with, so ci can't
      # drift from the release build
      - name: vet, test & build
        run: |
          docker run --rm -v "$PWD":/build -w /build -e CGO_ENABLED=0 golang:1.12 \
            sh -c 'go vet ./... && go test ./... && go build -o agent .'

  docker:
    name: Build & push docker
    needs: go
    runs-on: ubuntu-latest
    env:
      SECRET: ${{ secrets.DOCKERHUB_USER }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: compute tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: login to DockerHub
        if: env.SECRET != 0
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}
      # builds every run, pushes only once credentials exist on this repo
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.SECRET != 0 }}
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6
          tags: swarmpit/agent:${{ steps.tag.outputs.value }}
